function renderMemory(){let matched=[],flipped=[],moves=0,locked=false,done=false;const cards=[{id:'f1',pair:'f',mark:'✿',name:'Bunga'},{id:'m1',pair:'m',mark:'☾',name:'Bulan'},{id:'l1',pair:'l',mark:'✉',name:'Surat'},{id:'l2',pair:'l',mark:'✉',name:'Surat'},{id:'f2',pair:'f',mark:'✿',name:'Bunga'},{id:'m2',pair:'m',mark:'☾',name:'Bulan'}];const shuffle=[...cards].sort(()=>Math.random()-.5);const paint=()=>{const old=document.querySelector('.overlay');if(old)old.remove();document.getElementById('app').insertAdjacentHTML('beforeend',`<div class="overlay"><section class="modal"><div class="modal-top"><span>PUZZLE 01 · MEMORY MATCH</span><button class="close" id="closePuzzle">×</button></div><h2>Temukan pasangan yang cocok</h2><p class="intro">Cocokkan tiga pasang simbol untuk membuka kenangan kampus.</p><div class="memory-status"><span>Pasangan <b>${matched.length}/3</b></span><span>Langkah <b>${moves}</b></span></div><div class="memory-grid">${shuffle.map(c=>{let open=flipped.includes(c.id)||matched.includes(c.pair);return `<button class="memory-card ${open?'open':''} ${matched.includes(c.pair)?'matched':''}" data-card="${c.id}" ${matched.includes(c.pair)?'disabled':''}>${open?`<b>${c.mark}</b><small>${c.name}</small>`:'<b>✦</b>'}</button>`}).join('')}</div>${done?`<div class="modal-footer"><button class="btn primary" id="puzzleSuccess">AMBIL FRAGMEN →</button></div>`:`<p class="intro" style="margin:13px 0 0">TIP: inget simbolnya biar lebih cepat.</p>`}</section></div>`);document.getElementById('closePuzzle').onclick=()=>{modal=null;render()};document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{let c=shuffle.find(x=>x.id===b.dataset.card);if(locked||done||flipped.includes(c.id)||matched.includes(c.pair))return;flipped.push(c.id);if(flipped.length===2){moves++;let a=shuffle.find(x=>x.id===flipped[0]);if(a.pair===c.pair){matched.push(c.pair);flipped=[];if(matched.length===3)done=true;paint()}else{locked=true;paint();setTimeout(()=>{flipped=[];locked=false function renderRhythm(){const pattern=[0,1,2,0,2];let step=0,failed=false,feedback='Ikuti pola panggung: kiri, tengah, kanan.';const paint=()=>{const old=document.querySelector('.overlay');if(old)old.remove();document.getElementById('app').insertAdjacentHTML('beforeend',`<div class="overlay"><section class="modal"><div class="modal-top"><span>MINI GAME · SOUND CHECK</span><button class="close" id="closeRhythm">×</button></div><div class="rhythm-hero"><div class="lights">✦　✦　✦</div>SMAN 2 TANGERANG · STAGE MODE</div><h2>Ikuti ritmenya</h2><p class="intro">Tekan tombol sesuai urutan simbol. Klik tombol atau pakai keyboard A · S · D.</p><div class="rhythm-progress">${pattern.map((n,i)=>`<span class="${i<step?'passed':i===step?'active':''}">${['◀','●','▶'][n]}</span>`).join('')}</div><div class="rhythm-keys">${['◀','●','▶'].map((a,i)=>`<button class="rhythm-key" data-rkey="${i}" ${step===pattern.length||failed?'disabled':''}>${a}<small>${['A','S','D'][i]}</small></button>`).join('')}</div><p class="feedback ${failed?'bad':step===pattern.length?'good':''}">${feedback}</p>${failed?'<button class="btn primary" id="retryRhythm">↻ COBA LAGI</button>':step===pattern.length?'<button class="btn primary" id="successRhythm">SELESAI →</button>':'<div class="mono" style="text-align:center;color:#858ba0">COMBO '+step+'/'+pattern.length+'</div>'}</section></div>`);document.getElementById('closeRhythm').onclick=()=>{window.rhythmPress=null;modal=null;render()};document.querySelectorAll('[data-rkey]').forEach(b=>b.onclick=()=>press(+b.dataset.rkey));const retry=document.getElementById('retryRhythm');if(retry)retry.onclick=()=>{step=0;failed=false;feedback='Ikuti pola panggung: kiri, tengah, kanan.';paint()};const success=document.getElementById('successRhythm');if(success)success.onclick=()=>{window.rhythmPress=null;completeGame()};};const press=(v)=>{if(failed||step>=pattern.length)return;if(pattern[step]===v){step++;feedback=step===pattern.length?'Mantap. Set panggung selesai!':'Pas! function renderSequence(){const timeline=modal==='timeline';const items=timeline?[{id:'dpr',title:'Magang di DPR',desc:'Langkah awal pengalaman profesional'},{id:'psi',title:'Bergabung dengan PSI',desc:'Mulai aktif di dunia politik'},{id:'wm',title:'Asisten Wakil Menteri',desc:'Peran profesional saat ini'}]:[{id:'sma',title:'SMAN 94',desc:'Cerita yang pernah dibagikan'},{id:'ui',title:'UI · Ilmu Politik',desc:'Mengejar kampus impian'},{id:'career',title:'Dunia profesional',desc:'Melangkah ke bidang politik'}];let chosen=[],wrong=false;const paint=()=>{const old=document.querySelector('.overlay');if(old)old.remove();document.getElementById('app').insertAdjacentHTML('beforeend',`<div class="overlay"><section class="modal"><div class="modal-top"><span>STORY PUZZLE · ${timeline?'CAREER TIMELINE':'RECONNECT'}</span><button class="close" id="closeSequence">×</button></div><h2>${timeline?'Susun timeline karier':'Sambungkan kenangan'}</h2><p class="intro">${timeline?'Klik kartu dari yang paling awal sampai tahap berikutnya.':'Susun potongan perjalanan dari masa sekolah sampai sekarang.'}</p><div class="seq-list">${items.map((it,i)=>`<button class="seq-item ${chosen.includes(it.id)?'chosen':''} ${wrong&&chosen.includes(it.id)?'wrong':''}" data-seq="${it.id}" ${chosen.includes(it.id)?'disabled':''}><span class="num">${chosen.includes(it.id)?'✓':String(i+1).padStart(2,'0')}</span><span class="seq-copy"><b>${it.title}</b><small>${it.desc}</small></span>${chosen.includes(it.id)?'<small>#'+(chosen.indexOf(it.id)+1)+'</small>':''}</button>`).join('')}</div>${wrong?'<p class="feedback bad">Belum urut. Coba sekali lagi.</p>':''}${chosen.length===3&&!wrong?'<div class="modal-footer"><button class="btn primary" id="sequenceSuccess">BUKA FRAGMEN →</button></div>':'<p class="intro" style="margin:12px 0 0">'+chosen.length+'/3 kartu tersusun</p>'}</section></div>`);document.getElementById('closeSequence').onclick=()=>{modal=null;render()};document.querySelectorAll('[data-seq]').forEach(b= function renderLetter(){const text=letterPages[letterPage];const old=document.querySelector('.overlay');if(old)old.remove();document.getElementById('app').insertAdjacentHTML('beforeend',`<div class="overlay"><section class="letter"><div class="modal-top"><span>✉ A LETTER FOR YOU</span><button class="close" id="closeLetter">×</button></div><div class="letter-paper"><div class="letter-stamp">✦</div><div class="letter-kicker">FOR YOUR SPECIAL DAY</div><h2>Hey, you.</h2><div class="letter-copy">${text}</div><div class="letter-pagination">${String(letterPage+1).padStart(2,'0')} / ${String(letterPages.length).padStart(2,'0')}</div><div class="letter-buttons">${letterPage>0?'<button class="btn secondary" id="prevLetter">← SEBELUMNYA</button>':''}<button class="btn primary" id="nextLetter">${letterPage<letterPages.length-1?'LANJUT BACA →':'TUTUP SURAT ✓'}</button></div></div><p class="mono" style="text-align:center;color:#9196a9;margin-top:15px">A SMALL NOTE, WITH A LOT OF THOUGHT BEHIND IT.</p></section></div>`);document.getElementById('closeLetter').onclick=finishLetter;const prev=document.getElementById('prevLetter');if(prev)prev.onclick=()=>{letterPage=Math.max(0,letterPage-1);renderLetter()};document.getElementById('nextLetter').onclick=()=>{if(letterPage<letterPages.length-1){letterPage++;renderLetter()}else finishLetter()}}
function renderFinal(){const old=document.querySelector('.overlay');if(old)old.remove();document.getElementById('app').insertAdjacentHTML('beforeend',`<div class="overlay"><section class="final"><div style="display:flex;justify-content:space-between;color:var(--gold);font-size:16px"><span>✦　✧</span><span>✧　✦</span></div><div class="final-heart">♥</div><div class="overline">QUEST COMPLETE</div><h2>YOU MADE IT.</h2><p>Semua fragmen udah ketemu. Semoga perjalanan kecil ini bikin hari kamu sedikit lebih spesial.</p><button class="btn primary" id="readAgain">✉ BACA ULANG SURAT</button><button class="btn secondary" id="galleryBtn">▣ GALERI KENANGAN</button><button class="btn secondary" id="audioBtn">♫ VOICE NOTE</button><button class="btn secondary" id="videoBtn">▶ VIDEO UCAPAN</button><button class="textbtn" id="replay">↻ MAIN LAGI DARI AWAL</button><button class="close" id="closeFinal" style="position:absolute;right:10px;top:10px">×</button></section></div>`);document.getElementById('readAgain').onclick=()=>{showFinal=false;modal='letter';letterPage=0;render()};document.getElementById('galleryBtn').onclick=()=>{showFinal=false;returnToFinal=true;modal='gallery';render()};document.getElementById('audioBtn').onclick=()=>{showFinal=false;returnToFinal=true;modal='audio';render()};document.getElementById('videoBtn').onclick=()=>{showFinal=false;returnToFinal=true;modal='video';render()};document.getElementById('replay').onclick=()=>{window.gameMode=true;newGame()};document.getElementById('closeFinal').onclick=()=>{showFinal=false;render()}}
function renderSettings(){modalShell('Settings','Atur tampilan supaya nyaman buat kamu mainin.',`<div class="settingrow"><div><b>Kurangi animasi</b><small>Mematikan gerakan dekoratif yang tidak penting.</small></div><input type="checkbox" id="reduce" ${state.settings?.reduceMotion?'checked':''}></div><div class="settingrow"><div><b>Ukuran teks</b><small>Pilih ukuran tulisan dialog.</small></div><select id="textsize"><option value="small" ${state.settings?.textSize==='small'?'selected':''}>Kecil</option><option value="normal" ${state.settings?.textSize==='normal'?'selected':''}>Normal</option><option value="large" ${state.settings?.textSize==='large'?'selected':''}>Besar</option></select></div><div class="resetrow"><small>Hapus save lokal dan mulai lagi.</small><button class="btn secondary" id="reset" style="padding:8px">RESET SAVE</button></div><div class="modal-footer"><button class="btn primary" id="settingsDone">SELESAI ✓</button></div>`);document.getElementById('reduce').onchange=e=>{state.settings.reduceMotion=e.target.checked;persist();document.body.classList.toggle('reduce-motion',e.target.checked)};document.getElementById('textsize').onchange=e=>{state.settings.textSize=e.target.value;persist();document.body.style.setProperty('--dialogsize',e.target.value==='large'?'16px':e.target.value==='small'?'11px':'13px')};document.getElementById('reset').onclick=resetGame;document.getElementById('settingsDone').onclick=()=>{modal=null;render()}}
function renderJournal(){const rows=scenes.map((s,i)=>{let found=state.found[s.id]||[],objects=s.objects.filter(o=>!s.ending||o.special==='letter');let done=objects.every(o=>found.includes(o.id))&&(!s.game||state.games[s.id]);let unlocked=i<=Math.max(state.index,state.furthestIndex||0)||done;return `<button class="journal-item ${done?'done':''}" data-jump="${i}" ${!unlocked?'disabled':''}><span class="ji">${done?'✓':unlocked?'▤':'⌑'}</span><span><b>${s.title}</b><small>${s.chapter} · ${done?'KENANGAN DITEMUKAN':unlocked?'MASIH DIJELAJAHI':'BELUM TERBUKA'}</small></span>›</button>`}).join('');modalShell('Journal / Kenangan','Potongan cerita yang sudah ditemukan sepanjang perjalanan.',`<div class="journal">${rows}</div>`);document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{state.index=+b.dataset.jump;modal=null;showFinal=false;persist();render();dialogueStart(scene().intro)})}
function renderMedia(){const gallery=modal==='gallery',audio=modal==='audio';const title=gallery?'Galeri kenangan':audio?'Voice note':'Video ulang tahun';let body='';if(gallery){body=`<p class="intro">Pilih foto dari komputer kamu. File tidak diunggah ke server; foto hanya tampil di sesi browser ini.</p><input type="file" id="chooseMedia" accept="image/*" multiple style="max-width:100%;margin:8px 0 14px;color:#e8dcc5"><div class="uploaded-gallery">${customMedia.gallery.map((m,i)=>`<figure><img src="${m.url}" alt="Kenangan ${i+1}"><figcaption>${m.name}</figcaption></figure>`).join('')}</div>`}else if(audio){body=`<p class="intro">Pilih voice note dari komputer kamu. File diputar langsung di browser dan tidak diunggah.</p><input type="file" id="chooseMedia" accept="audio/*" style="max-width:100%;margin:8px 0 14px;color:#e8dcc5">${customMedia.audio?`<div class="uploaded-audio"><b>♫ ${customMedia.audio.name}</b><audio controls src="${customMedia.audio.url}" style="display:block;width:100%;margin-top:12px"></audio></div>`:''}`}else{body=`<p class="intro">Pilih video ucapan ulang tahun dari komputer kamu. File diputar langsung di browser dan tidak diunggah.</p><input type="file" id="chooseMedia" accept="video/*" style="max-width:100%;margin:8px 0 14px;color:#e8dcc5">${customMedia.video?`<div class="uploaded-video"><b>▶ ${customMedia.video.name}</b><video controls playsinline src="${customMedia.video.url}" style="display:block;width:100%;max-height:310px;margin-top:12px;background:#171b2d"></video></div>`:''}`}modalShell(title,gallery?'Pilih beberapa foto dari folder gambar.':audio?'Tambahkan rekaman suara untuk diputar di sini.':'Tambahkan video untuk diputar di sini.',`${body}<div class="modal-footer"><button class="btn primary" id="mediaClose">TUTUP</button></div>`);const input=document.getElementById('chooseMedia');if(input)input.onchange=e=>{const files=[...(e.target.files||[])];if(gallery){customMedia.gallery.forEach(m=>URL.revokeObjectURL(m.url));customMedia.gallery=files.map(f=>({name:f.name,url:URL.createObjectURL(f)}))}else if(audio&&files[0]){if(customMedia.audio)URL.revokeObjectURL(customMedia.audio.url);customMedia.audio={name:files[0].name,url:URL.createObjectURL(files[0])}}else if(!gallery&&!audio&&files[0]){if(customMedia.video)URL.revokeObjectURL(customMedia.video.url);customMedia.video={name:files[0].name,url:URL.createObjectURL(files[0])}}renderMedia()};document.getElementById('mediaClose').onclick=()=>{modal=null;if(returnToFinal){returnToFinal=false;showFinal=true}render()}}
function renderModalOnTitle(){/* title settings are handled by the same reusable modal */renderSettings()}
function startRender(){render()}
window.addEventListener('keydown',e=>{if(modal==='rhythm'&&window.rhythmPress&&['a','s','d'].includes(e.key.toLowerCase())){e.preventDefault();window.rhythmPress(['a','s','d'].indexOf(e.key.toLowerCase()));return}if(window.gameMode&&!modal&&!showFinal&&!dialog&&['arrowleft','arrowright','a','d'].includes(e.key.toLowerCase())){e.preventDefault();if(objectActionTimer)clearTimeout(objectActionTimer);moveLehaTo(characterX+(['arrowleft','a'].includes(e.key.toLowerCase())?-5:5));return}if(e.key==='Escape'&&window.gameMode&&!modal&&!showFinal&&!dialog){openModal('pause')}if((e.code==='Space'||e.key==='Enter')&&window.gameMode&&dialog&&!modal){e.preventDefault();nextDialog()}else if((e.code==='Space'||e.key==='Enter')&&window.gameMode&&!dialog&&!modal&&!showFinal&&ready()){e.preventDefault();nextScene()}});
render();
</script>
</body>
</html>
